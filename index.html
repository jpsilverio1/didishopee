<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Link Afiliado - Shopee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #d00070, #6200ea);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      text-align: center;
    }

    input[type="url"] {
      padding: 10px;
      border: none;
      border-radius: 8px;
      width: 80%;
      max-width: 500px;
      font-size: 1em;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #ff9900;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e68100;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9em;
      color: #ddd;
    }
  </style>
</head>
<body>
  <h1>💖 Link Shopee com amor (e comissão)</h1>
  <p>Cole o link do produto abaixo e gere um link com o ID da sua amiga afiliada.</p>

<textarea id="linkArea" placeholder="Cole vários links da Shopee, um por linha (MÁXIMO DE 50)..." rows="6" cols="50"></textarea>
<button onclick="gerarLinks()">Gerar links afiliados</button>
<div id="output"></div>

  <footer>© Powered by Jéssica Silvério<br><a href="mailto:jpsilverio1mc@gmail.com" style="color: #fff; text-decoration: underline;">Fale comigo por e-mail</a> se desejar um site semelhante para você</footer>
<script>
  function gerarLinks() {
    const input = document.getElementById('linkArea').value.trim();
    const output = document.getElementById('output');
    const idAfiliada = '18312330567';
    output.innerHTML = '';

    if (!input) {
      output.innerHTML = 'Por favor, cole ao menos um link.';
      return;
    }

    const linhas = input.split(/\\r?\\n/);
    const linksValidos = [];
    const linksInvalidos = [];

    linhas.forEach(link => {
      const url = link.trim();
      if (url && url.startsWith("http")) {
        const linkAfiliado = `https://shope.ee/6AFiliado?utm_campaign=${idAfiliada}&utm_content=${encodeURIComponent(url)}`;
        linksValidos.push(linkAfiliado);
      } else if (url) {
        linksInvalidos.push(url);
      }
    });

    if (linksValidos.length > 0) {
      output.innerHTML += '<p>✅ Links gerados:</p><ul>' + linksValidos.map(l => `<li><a href="${l}" target="_blank">${l}</a></li>`).join('') + '</ul>';
    }

    if (linksInvalidos.length > 0) {
      output.innerHTML += '<p>❌ Link(s) inválido(s):</p><ul>' + linksInvalidos.map(l => `<li>${l}</li>`).join('') + '</ul>';
      output.innerHTML += '<p><a href="https://www.instagram.com/didishopee" target="_blank">Me chama no Instagram se tiver dúvida</a></p>';
    }
  }
</script>

</body>
</html>
