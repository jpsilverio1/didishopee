<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Link Afiliado - Shopee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #d00070, #6200ea);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      text-align: center;
    }

    textarea {
      padding: 10px;
      border: none;
      border-radius: 8px;
      width: 80%;
      max-width: 500px;
      font-size: 1em;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #ff9900;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e68100;
    }

    .link-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 500px;
    }

    .link-text {
      flex: 1;
      word-break: break-word;
      margin-right: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 5px;
      border-radius: 5px;
    }

    #linkContainer {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
    }

    footer {
      background-color: rgba(0, 0, 0, 0.2);
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #ddd;
    }

    footer a {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💖 Link Shopee com amor (e comissão)</h1>
    <p>Cole os links dos produtos abaixo e gere links com o ID da sua amiga afiliada.</p>

    <textarea id="linkArea" placeholder="Cole vários links da Shopee, um por linha (MÁXIMO DE 50)..." rows="6"></textarea>
    <button onclick="gerarLinks()">Gerar links afiliados</button>

    <div id="linkContainer"></div>
  </div>

  <footer>
    © Powered by Jéssica Silvério<br>
    <a href="mailto:jpsilverio1mc@gmail.com">Fale comigo por e-mail</a> se desejar um site semelhante para você
  </footer>

  <script>
    function gerarLinks() {
      const input = document.getElementById('linkArea').value.trim();
      const linkContainer = document.getElementById('linkContainer');
      linkContainer.innerHTML = ''; // Limpa os links anteriores

      if (!input) {
        alert('Por favor, insira ao menos um link.');
        return;
      }

      const linhas = input.split(/\r?\n/);
      console.alert(linhas);
      const linksValidos = [];

      linhas.forEach((link) => {
        const url = link.trim();
        if (url && url.startsWith('http')) {
          // Exemplo de geração de link afiliado
          const linkAfiliado = `${url}?utm_campaign=18312330567`;
          const fallBackLink = `https://www.instagram.com/ingriduckervinon`;
           linksValidos.push(linkAfiliado);

        } else {
          console.alert("Não consegui converter pelo menos um dos links que você enviou. Por favor me mande diretamente em meu instagram.")
          linksValidos.push(fallBackLink);
        }
                   

          const linkItem = document.createElement('div');
          linkItem.className = 'link-item';

          const linkText = document.createElement('div');
          linkText.className = 'link-text';
          linkText.textContent = linkAfiliado;

          const copyBtn = document.createElement('button');
          copyBtn.textContent = 'Copiar';
          copyBtn.onclick = () => copiarTexto(linkAfiliado);

          linkItem.appendChild(linkText);
          linkItem.appendChild(copyBtn);
          linkContainer.appendChild(linkItem);
        }
      });

      if (linksValidos.length > 0) {
        const copyAllBtn = document.createElement('button');
        copyAllBtn.id = 'copyAllBtn';
        copyAllBtn.textContent = 'Copiar Todos';
        copyAllBtn.onclick = () => copiarTexto(linksValidos.join('\n'));
        linkContainer.prepend(copyAllBtn);
      }
    }

    function copiarTexto(texto, "Link inválido - clique aqui para ir ao meu instagram") {
      navigator.clipboard.writeText(texto).then(() => {
        alert('Texto copiado para a área de transferência!');
      }).catch(err => {
        console.error('Erro ao copiar texto: ', err);
      });
    }
  </script>
</body>
</html>
