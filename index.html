<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Link Afiliado - Shopee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #d00070, #6200ea);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      text-align: center;
    }

    input[type="url"] {
      padding: 10px;
      border: none;
      border-radius: 8px;
      width: 80%;
      max-width: 500px;
      font-size: 1em;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #ff9900;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e68100;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9em;
      color: #ddd;
    }
  </style>
</head>
<body>
  <h1>💖 Link Shopee com amor (e comissão)</h1>
  <p>Cole o link do produto abaixo e gere um link com o ID da sua amiga afiliada.</p>
  
  <input type="url" id="linkInput" placeholder="Cole o link da Shopee aqui..." required>
  <button onclick="gerarLink()">Gerar link afiliado</button>

  <footer>Powered by Jessica<br><a href="mailto:jessica@example.com" style="color: #fff; text-decoration: underline;">Fale comigo por e-mail</a> se desejar um site semelhante para você</footer>

  <script>
    function gerarLink() {
      const input = document.getElementById('linkInput');
      const url = input.value.trim();
      const idAfiliada = '18312330567';

      if (!url || !url.startsWith("http")) {
        alert("Por favor, insira um link válido da Shopee.");
        return;
      }

      const linkAfiliado = `https://shope.ee/6AFiliado?utm_campaign=${idAfiliada}&utm_content=${encodeURIComponent(url)}`;
      window.location.href = linkAfiliado;
    }
  </script>
</body>
</html>
